# ==============================================================================
# Stateful Application-Layer Firewall & Intrusion Filter - L7 Signatures
# Author: Ayush Behera
#
# Syntax Specification:
#   RULE <id> <target> <action> <category> "<regex_pattern>" <description>
#
# Target Fields:
#   ANY    - Inspects across URI, headers, body, or raw payload
#   URI    - Inspects HTTP Request URI (raw & URL-decoded)
#   HEADER - Inspects HTTP Request Header values (e.g. User-Agent, Cookie)
#   BODY   - Inspects HTTP POST/PUT payload body
#   DNS    - Inspects DNS Question Domain Name
#
# Actions:
#   DROP   - Rejects the packet immediately (issues NF_DROP)
#   ALERT  - Allows the packet through (NF_ACCEPT) but logs a security warning
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. SQL Injection (SQLi) Signatures
# ------------------------------------------------------------------------------
RULE SQLI-101 URI DROP SQLI "(?i)(union(\s+all)?\s+select)" Classic UNION-based SQL injection in URI parameter
RULE SQLI-102 BODY DROP SQLI "(?i)(union(\s+all)?\s+select)" Classic UNION-based SQL injection in request body
RULE SQLI-103 ANY DROP SQLI "(?i)('(\s*or\s*|\s*and\s*)[^\r\n]+[=<>])" Boolean-based tautology injection (' OR '1'='1)
RULE SQLI-104 ANY DROP SQLI "(?i)(sleep\s*\(\s*\d+\s*\)|benchmark\s*\(\s*\d+|waitfor\s+delay|pg_sleep)" Time-based blind SQL injection probe
RULE SQLI-105 ANY DROP SQLI "(?i)(information_schema\.(tables|columns|schemata)|sys\.(databases|tables))" Database catalog enumeration attempt
RULE SQLI-106 ANY DROP SQLI "(?i)(drop\s+table|alter\s+table|delete\s+from|insert\s+into\s+[a-z_]+\s+values)" Destructive DDL/DML injection vector
RULE SQLI-107 ANY DROP SQLI "(?i)(;\s*exec\s*\(|xp_cmdshell|exec\s+sp_configure)" Stacked MSSQL command shell execution

# ------------------------------------------------------------------------------
# 2. Cross-Site Scripting (XSS) Signatures
# ------------------------------------------------------------------------------
RULE XSS-101 ANY DROP XSS "(?i)(<\s*script[^>]*>|javascript\s*:|vbscript\s*:)" Inline script execution vector
RULE XSS-102 ANY DROP XSS "(?i)(on(load|error|click|mouseover|focus|blur|submit)\s*=)" Inline DOM event handler injection
RULE XSS-103 ANY DROP XSS "(?i)(<\s*(img|svg|iframe|body|input|audio|video)[^>]+(onerror|onload)\s*=)" HTML5 tag payload execution vector
RULE XSS-104 ANY DROP XSS "(?i)(document\.(cookie|location|write)|window\.location)" Client session token or DOM tampering attempt
RULE XSS-105 ANY DROP XSS "(?i)(alert\s*\(|confirm\s*\(|prompt\s*\(|eval\s*\()" Dynamic JavaScript execution primitives

# ------------------------------------------------------------------------------
# 3. Path Traversal & Local File Inclusion (LFI)
# ------------------------------------------------------------------------------
RULE TRAV-101 URI DROP TRAVERSAL "(\.\./|\.\.\\|%2e%2e%2f|%2e%2e\/|\.\.%2f)" Directory traversal sequence in URI
RULE TRAV-102 ANY DROP TRAVERSAL "(?i)(/etc/(passwd|shadow|hosts|issue|sudoers)|boot\.ini|winnt/system32)" Sensitive system configuration file access

# ------------------------------------------------------------------------------
# 4. Remote Code Execution (RCE) & Shell Command Injection
# ------------------------------------------------------------------------------
RULE RCE-101 ANY DROP RCE "(\||;|&|`|\$\()\s*(cat\s+/etc/passwd|id\b|whoami\b|uname\s+-a|nc\s+-e|bash\s+-i|curl\s+http|wget\s+http)" Remote shell command chaining
RULE RCE-102 ANY DROP RCE "(?i)(php://(input|filter)|data://text/plain)" Malicious PHP stream wrapper injection

# ------------------------------------------------------------------------------
# 5. Malicious Vulnerability Scanners & Reconnaissance Bots
# ------------------------------------------------------------------------------
RULE SCAN-101 HEADER DROP MALICIOUS_UA "(?i)(sqlmap|nikto|w3af|dirbuster|acunetix|masscan|zgrab|nmap\s+scripting)" Automated vulnerability scanner User-Agent
RULE SCAN-102 HEADER ALERT SCANNER "(?i)(curl/|python-requests/|Go-http-client/|Wget/)" Generic scripted HTTP client detection

# ------------------------------------------------------------------------------
# 6. DNS Tunneling & Malicious Queries
# ------------------------------------------------------------------------------
RULE DNS-101 DNS DROP DNS "(?i)\.(onion|local|test|invalid)$" Queries for unresolvable or darknet top-level domains
RULE DNS-102 DNS ALERT DNS "(?i)(c2\.|botnet\.|exfil\.|malware\.)" Suspicious C2 command-and-control domain prefixes
